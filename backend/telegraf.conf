# Telegraf config for the TTN webhook -> influx pipeline (docker5:/docker/monitoring).
# Rewritten 2026-07-31 for the v7 hard cutoff: gisebo-01 is decommissioned, so
# this speaks gisebo-05's v7 decoder vocabulary directly. The decoder's output
# IS this schema -- any field change in decoders/gisebo-05-v7.js lands here.
#
# Replace <<<token>>> with the influx token before deploying.

[agent]
interval = "10s"
round_interval = true
debug = true
skip_processors_after_aggregators = true

[[inputs.http_listener_v2]]
service_address = ":8080"
paths = ["/telegraf"]
methods = ["POST"]
data_format = "json_v2"

[[inputs.http_listener_v2.json_v2]]
timestamp_path = "received_at"
timestamp_format = "RFC3339"

# ---- tags -------------------------------------------------------------
[[inputs.http_listener_v2.json_v2.tag]]
path = "end_device_ids.device_id"
rename = "device_id"

# f_port separates frame kinds AND proves mode: 11 = PROD solar data,
# 21 = DEV solar data, 1/2 = fault frames (PROD/DEV), 3 = DEV verbose,
# 10 = the INA219 misdetect alarm signature (solar unit booted PRIMARY).
[[inputs.http_listener_v2.json_v2.tag]]
path = "uplink_message.f_port"
rename = "f_port"

# ---- pre-existing fields (gisebo-01 era; types unchanged) -------------
[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.battery_v"
type = "float"
optional = true

# v6-only; kept in case gisebo-04's fridge uplinks share this webhook.
[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.sequence"
type = "int"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.version"
type = "float"
optional = true

# ---- radio / link margin ----------------------------------------------
[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.f_cnt"
type = "int"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.rx_metadata.0.rssi"
rename = "rssi"
type = "int"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.rx_metadata.0.snr"
rename = "snr"
type = "float"
optional = true

# ---- v7 data frame (FPort 11 PROD / 21 DEV) ---------------------------
[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.uplink_counter"
type = "int"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.interval_index"
type = "int"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.interval_minutes"
type = "int"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.mode"
type = "string"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.panel_v"
type = "float"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.panel_ma"
type = "float"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.sun_ewma"
type = "float"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.bonus_active"
type = "bool"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.harvest_mah"
type = "int"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.clarity"
type = "float"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.expected_daylight_fraction"
type = "float"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.soft_reset"
type = "bool"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.tx_timeout"
type = "bool"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.clock_valid"
type = "bool"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.cold_boot"
type = "bool"
optional = true

# ---- fault frame (FPort 1 PROD / 2 DEV) -------------------------------
# faults/reset_causes are string arrays and are deliberately skipped;
# fault_bits and reset_cause carry the same information numerically.
# Grafana alert condition: fault_bits > 0.
[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.fault_bits"
type = "int"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.healthy"
type = "bool"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.ds18_status"
type = "string"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.sensor_fail_streak"
type = "int"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.ds18_rom"
type = "string"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.ds18b20_count"
type = "int"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.ina219_config_ok"
type = "bool"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.sensor_bus_ambiguous"
type = "bool"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.reset_cause"
type = "int"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.boot_counter"
type = "int"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.diag_schema"
type = "int"
optional = true

# ---- verbose frame (FPort 3, DEV bench sessions only) -----------------
[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.voltage_offset"
type = "int"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.season"
type = "string"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.cycle_count"
type = "int"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.uptime_s"
type = "int"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.surface_temp"
type = "float"
optional = true

[[inputs.http_listener_v2.json_v2.field]]
path = "uplink_message.decoded_payload.fw_commit"
type = "string"
optional = true

# ---- per-entry temperature points (unchanged) -------------------------
[[inputs.http_listener_v2.json_v2.object]]
path = "uplink_message.decoded_payload.entries"
timestamp_key = "timestamp"
timestamp_format = "RFC3339"
optional = true

[inputs.http_listener_v2.json_v2.object.fields]
temperature = "float"
temperature_state = "string"

[[outputs.influxdb_v2]]
urls = ["http://influxdb:8086"]
token = "<<<token>>>"
organization = "myhouse"
bucket = "home_assistant"
